<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Global trade map: marketplaces in many countries connected by one protocol, with an open logistics pool underneath">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Rangkai: small-business trade across countries</text>

  <!-- Protocol band -->
  <rect x="40" y="200" width="820" height="90" rx="12" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">The protocol: one shared set of rules</text>
  <text x="450" y="252" text-anchor="middle" font-size="13" fill="#1e3a8a">Identity and reputation · Catalog and search · Escrow and fees · Disputes · Governance</text>
  <text x="450" y="274" text-anchor="middle" font-size="12" fill="#475569">Marketplaces share one catalog and one search. No people behind the protocol: marketplaces carry the judgement.</text>

  <!-- Marketplaces -->
  <g font-size="13" fill="#1a1a1a">
    <rect x="50" y="70" width="170" height="90" rx="10" fill="#fff4e0" stroke="#d9822b" stroke-width="2"/>
    <text x="135" y="95" text-anchor="middle" font-weight="bold">Marketplace A</text>
    <text x="135" y="115" text-anchor="middle" font-size="12">e.g. furniture, Indonesia</text>
    <text x="135" y="138" text-anchor="middle" font-size="11" fill="#475569">sellers + buyers</text>

    <rect x="250" y="70" width="170" height="90" rx="10" fill="#fff4e0" stroke="#d9822b" stroke-width="2"/>
    <text x="335" y="95" text-anchor="middle" font-weight="bold">Marketplace B</text>
    <text x="335" y="115" text-anchor="middle" font-size="12">e.g. ceramics, Malaysia</text>
    <text x="335" y="138" text-anchor="middle" font-size="11" fill="#475569">sellers + buyers</text>

    <rect x="480" y="70" width="170" height="90" rx="10" fill="#fff4e0" stroke="#d9822b" stroke-width="2"/>
    <text x="565" y="95" text-anchor="middle" font-weight="bold">Marketplace C</text>
    <text x="565" y="115" text-anchor="middle" font-size="12">e.g. textiles, Peru</text>
    <text x="565" y="138" text-anchor="middle" font-size="11" fill="#475569">sellers + buyers</text>

    <rect x="680" y="70" width="170" height="90" rx="10" fill="#fff4e0" stroke="#d9822b" stroke-width="2"/>
    <text x="765" y="95" text-anchor="middle" font-weight="bold">Marketplace D</text>
    <text x="765" y="115" text-anchor="middle" font-size="12">any industry, any country</text>
    <text x="765" y="138" text-anchor="middle" font-size="11" fill="#475569">run by an entrepreneur</text>
  </g>
  <g stroke="#3b5bdb" stroke-width="2" fill="none">
    <line x1="135" y1="160" x2="135" y2="200"/><line x1="335" y1="160" x2="335" y2="200"/>
    <line x1="565" y1="160" x2="565" y2="200"/><line x1="765" y1="160" x2="765" y2="200"/>
  </g>

  <!-- Buyers across the top -->
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#475569">Buyers in any country search across all marketplaces</text>

  <!-- Money -->
  <rect x="40" y="320" width="820" height="50" rx="10" fill="#e6f6ec" stroke="#2f9e44" stroke-width="2"/>
  <text x="450" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Payment held in escrow, then split on payout</text>
  <text x="450" y="360" text-anchor="middle" font-size="12" fill="#1b5e20">Bitcoin · Stripe · to seller, logistics provider, marketplace and protocol</text>
  <g stroke="#2f9e44" stroke-width="2"><line x1="450" y1="290" x2="450" y2="320"/></g>

  <!-- Logistics layer -->
  <rect x="40" y="400" width="820" height="130" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="450" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c2fa8">Open logistics pool (underneath, KYC providers only)</text>
  <g font-size="12" fill="#4c2fa8" text-anchor="middle">
    <rect x="60" y="445" width="120" height="34" rx="6" fill="#fff" stroke="#7048e8"/><text x="120" y="467">Air</text>
    <rect x="195" y="445" width="120" height="34" rx="6" fill="#fff" stroke="#7048e8"/><text x="255" y="467">Sea</text>
    <rect x="330" y="445" width="120" height="34" rx="6" fill="#fff" stroke="#7048e8"/><text x="390" y="467">Road and rail</text>
    <rect x="465" y="445" width="120" height="34" rx="6" fill="#fff" stroke="#7048e8"/><text x="525" y="467">Last mile</text>
    <rect x="600" y="445" width="120" height="34" rx="6" fill="#fff" stroke="#7048e8"/><text x="660" y="467">Customs, forwarders</text>
    <rect x="735" y="445" width="105" height="34" rx="6" fill="#fff" stroke="#7048e8"/><text x="787" y="467">Warehousing</text>
  </g>
  <text x="450" y="505" text-anchor="middle" font-size="12" fill="#4c2fa8">Providers quote for any marketplace. Buyers without a quote arrange their own, and anonymous users always do.</text>
  <g stroke="#7048e8" stroke-width="2"><line x1="450" y1="370" x2="450" y2="400"/></g>
</svg>
